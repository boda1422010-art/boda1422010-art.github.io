html{

body{

  display:flex;
  align-items:flex-start;

.card{width:100%;max-width:460px;background:rgba(255,255,255,0.08);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.12);border-radius:32px;padding:32px 24px 24px;text-align:center}
.avatar{width:110px;height:110px;border-radius:50%;object-fit:cover;margin:0 auto 20px;display:block;border:3px solid rgba(255,255,255,0.15);filter:grayscale(100%)}
h1{color:#fff;font-size:30px;font-weight:800;margin-bottom:6px}
.role{color:#fff;opacity:0.8;font-size:16px;margin-bottom:6px}
.email{color:#fff;opacity:0.4;font-size:13px;margin-bottom:24px;word-break:break-all}
.links{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.link{position:relative;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.08);border-radius:18px;height:56px;color:#fff;text-decoration:none;font-weight:600;font-size:14px;transition:0.2s}
.link:hover{transform:scale(1.02);background:rgba(255,255,255,0.2)}
.link .left{position:absolute;left:16px;width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.link .center{text-align:center;width:100%;padding:0 40px}
.link .arrow{position:absolute;right:14px;opacity:0.5;font-size:12px}
.full{grid-column:1 / -1}
.ip-real{width:22px;height:22px;object-fit:contain;opacity:0.9}
